app:
  name: llm-gate
  version: 0.0.1
  admin_role_id: 1

server:
  host: 0.0.0.0
  port: 8080

db:
  driver: sqlite
  database: ./data.db

jwt:
  secret: llm-gate-secret-key
  issuer: llm-gate
  access_token_expire: 2h
  refresh_token_expire: 168h
  algorithm: HS256

relay:
  timeout: 120
  max_body_mb: 32
  pre_consume_cents: 100
  stream_fallback_cents: 100
  rate_limit:
    enabled: true
    rate: 10
    burst: 20
    global_rate: 0
    global_burst: 0
    account_rate: 0
    account_burst: 0
  upstream:
    retry_enabled: true
    max_retries: 2
    retry_delay_ms: 200
  failover:
    enabled: true
    failure_threshold: 5
    window: 60s
    cooldown: 30s
    health_probe_enabled: true
    health_probe_interval: 30s

billing:
  base_price_cents_per_1k: 2
  min_balance_cents: 1000

security:
  # AES-256 加密密钥，64 位十六进制（32 字节）；未配置时回退到 JWT Secret 派生，生产环境必须配置
  encrypt_key: ""
  reveal_audit: true

retention:
  usage_days: 0
  transaction_days: 0
  expired_token_grace_days: 0
  check_interval: 24h

alert:
  enabled: false
  webhook_url: ""
  sign_secret: ""
  cooldown: 10m

cors:
  allow_origins:
    - "*"

pprof:
  enabled: true

# Redis 缓存（可选，多节点部署时配置）
# redis:
#   addr: "127.0.0.1:6379"
#   password: ""
#   db: 0
#   pool_size: 10
#   min_idle_conns: 2
#   key_prefix: "llm-gate"

logger:
  level: 0
  encoding: json
  output:
    - stdout
  caller: true
